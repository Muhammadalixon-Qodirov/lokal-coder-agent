- id: py-discount-bounds
  fixture: shop
  task: "`apply_discount` da xato bor: chegirma foizi 0 dan kichik yoki 100 dan katta bo'lsa ham qabul qilinyapti. Bunday holatda ValueError chiqarsin."
  hidden_file: tests/test_hidden.py
  hidden: |
    import pytest
    from shop.services import ShopService

    def _svc():
        s = ShopService(); s.add_product("Choy", 12000, stock=10); s.create_customer("Ali", "a@b.uz"); return s

    def test_discount_bounds():
        s = _svc(); o = s.create_order(1, [(1, 1)])
        for bad in (-5, 101, 150):
            with pytest.raises(ValueError):
                s.apply_discount(o.id, bad)
        s.apply_discount(o.id, 100); assert o.total == 0
        s.apply_discount(o.id, 0); assert o.total == 12000
  test: pytest -q tests/test_hidden.py tests/test_services.py

- id: py-format-som
