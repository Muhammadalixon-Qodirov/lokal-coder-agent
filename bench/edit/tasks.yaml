- id: go-list-sorted
  fixture: notes
  task: "GET /notes ro'yxati yangi qaydlar birinchi bo'ladigan tartibda (CreatedAt bo'yicha kamayish) qaytsin. CreatedAt teng bo'lsa ID kattasi birinchi."
  hidden_file: hidden_test.go
  hidden: |
    package notes

    import (
    	"testing"
    	"time"
    )

    func TestHiddenSorted(t *testing.T) {
    	s := NewStore()
    	base := time.Date(2026, 1, 1, 0, 0, 0, 0, time.UTC)
    	times := []time.Time{base, base.Add(time.Hour), base.Add(time.Hour), base.Add(-time.Hour)}
    	i := 0
    	s.now = func() time.Time { t := times[i]; i++; return t }
    	for range times {
    		s.Create("t", "")
    	}
    	got := []int{}
    	for _, n := range s.List() {
    		got = append(got, n.ID)
    	}
    	want := []int{3, 2, 1, 4}
    	for k := range want {
    		if len(got) != len(want) || got[k] != want[k] {
    			t.Fatalf("got %v want %v", got, want)
    		}
    	}
    }
  test: go test ./...

