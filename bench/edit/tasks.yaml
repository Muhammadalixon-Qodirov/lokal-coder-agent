- id: py-product-search
  fixture: shop
  task: "ProductRepository ga `search(query: str)` metodini qo'sh: nomida query uchraydigan mahsulotlarni qaytarsin, katta-kichik harf farqi hisobga olinmasin. Bo'sh query bo'lsa bo'sh ro'yxat qaytsin."
  hidden_file: tests/test_hidden.py
  hidden: |
    from shop.services import ShopService

    def test_search():
        s = ShopService()
        s.add_product("Ko'k choy", 12000); s.add_product("Qora CHOY", 15000); s.add_product("Non", 4000)
        assert sorted(p.name for p in s.products.search("choy")) == ["Ko'k choy", "Qora CHOY"]
        assert [p.name for p in s.products.search("NON")] == ["Non"]
        assert s.products.search("") == []
        assert s.products.search("qahva") == []
  test: pytest -q tests/test_hidden.py tests/test_services.py

- id: py-cancel-order
  fixture: shop
  task: "Buyurtmani bekor qilish: ShopService ga `cancel_order(order_id)` qo'sh. Faqat `new` statusdagi buyurtma bekor qilinadi (status `cancelled` bo'ladi) va mahsulotlar soni (stock) omborga qaytariladi. Buyurtma topilmasa yoki statusi boshqa bo'lsa ValueError."
  hidden_file: tests/test_hidden.py
  hidden: |
    import pytest
    from shop.services import ShopService

    def _svc():
        s = ShopService(); s.add_product("Choy", 12000, stock=10); s.add_product("Non", 4000, stock=5)
        s.create_customer("Ali", "a@b.uz"); return s

    def test_cancel_returns_stock():
        s = _svc(); o = s.create_order(1, [(1, 3), (2, 2)])
        s.cancel_order(o.id)
        assert o.status == "cancelled"
        assert s.products.get(1).stock == 10 and s.products.get(2).stock == 5

    def test_cancel_errors():
        s = _svc(); o = s.create_order(1, [(1, 1)])
        s.pay_order(o.id)
        with pytest.raises(ValueError):
            s.cancel_order(o.id)
        with pytest.raises(ValueError):
            s.cancel_order(999)
  test: pytest -q tests/test_hidden.py tests/test_services.py

- id: py-email-validation
  fixture: shop
  task: "Validate the customer email in create_customer: it must contain exactly one '@', a non-empty part before it, and a domain with a dot after it; otherwise raise ValueError('invalid email'). Store the email lowercased."
  hidden_file: tests/test_hidden.py
  hidden: |
    import pytest
    from shop.services import ShopService

    def test_email():
        s = ShopService()
        c = s.create_customer("Ali", "  Ali@Example.COM ")
        assert c.email == "ali@example.com"
        for bad in ("ali", "@example.com", "ali@example", "a@b@c.com", "ali@com"):
            with pytest.raises(ValueError, match="invalid email"):
                s.create_customer("X", bad)
  test: pytest -q tests/test_hidden.py tests/test_services.py

- id: py-api-get-product
  fixture: shop
  task: "Add an API endpoint GET /products/{product_id} that returns 200 with the product dict, or 404 with {'error': 'product not found'}."
  hidden_file: tests/test_hidden.py
  hidden: |
    from shop.api import App

    def test_get_product():
        app = App()
        app.handle("POST", "/products", {"name": "Choy", "price": 12000, "stock": 3})
        status, body = app.handle("GET", "/products/1")
        assert status == 200 and body == {"id": 1, "name": "Choy", "price": 12000, "stock": 3}
        assert app.handle("GET", "/products/7") == (404, {"error": "product not found"})
        assert app.handle("GET", "/products")[0] == 200
  test: pytest -q tests/test_hidden.py tests/test_services.py

- id: py-order-created-at
  fixture: shop
  task: "Order modeliga `created_at` maydonini qo'sh (standart qiymat — hozirgi UTC vaqt, timezone-aware datetime). `Order.to_dict()` uni ISO 8601 formatda `created_at` kaliti bilan qaytarsin."
  hidden_file: tests/test_hidden.py
  hidden: |
    from datetime import datetime, timezone
    from shop.models import Order

    def test_created_at():
        o = Order(1, 1)
        assert o.created_at.tzinfo is not None
        assert abs((datetime.now(timezone.utc) - o.created_at).total_seconds()) < 5
        d = o.to_dict()
        assert d["created_at"] == o.created_at.isoformat()
        assert datetime.fromisoformat(d["created_at"]) == o.created_at
        assert Order(2, 1).created_at >= o.created_at
  test: pytest -q tests/test_hidden.py tests/test_services.py

