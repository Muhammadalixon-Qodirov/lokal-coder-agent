    package notes

    import (
    	"strings"
    	"testing"
    )

    func TestHiddenTitle(t *testing.T) {
    	srv := NewServer(NewStore())
    	for _, body := range []string{`{"title":""}`, `{"title":"   "}`, `{}`} {
    		r := do(t, srv, "POST", "/notes", body)
    		if r.Code != 400 || !strings.Contains(r.Body.String(), `"error":"title required"`) {
    			t.Fatalf("%s → %d %s", body, r.Code, r.Body)
    		}
    	}
    	r := do(t, srv, "POST", "/notes", `{"title":"  salom  "}`)
    	if r.Code != 201 || !strings.Contains(r.Body.String(), `"title":"salom"`) {
    		t.Fatalf("trim: %d %s", r.Code, r.Body)
    	}
    }
